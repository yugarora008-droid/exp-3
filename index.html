<!doctype html> 
<html lang="en"> 
<head> 
 <meta charset="utf-8"> 
 <meta name="viewport" content="width=device-width, initial-scale=1"> 
 <title>To-Do List</title> 
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
 rel="stylesheet"> 
</head> 
<body> 
 <div class="container min-vh-100 d-flex justify-content-center align-items-center"> 
 <div class="card shadow p-4" style="width: 450px;"> 
 <main class="container py-4"> 
 <h1>TO-DO LIST</h1> 
 <form id="todo-form" class="mb-3"> 
 <div class="input-group"> 
 <input id="todo-input" class="form-control" 
 placeholder="Add a new task..." required> 
 <button class="btn btn-primary" type="submit">Add Task</button> 
 </div> 
 </form> 
<ol id="todo-list" class="list-group list-group-numbered"></ol> 
 </main> 
 <script src="script.js"></script> 
</body> 
</html>
